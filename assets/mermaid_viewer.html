<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0D0D0F;
      color: #E5E5E7;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    #container {
      max-width: 100%;
      overflow: auto;
    }
    .mermaid {
      max-width: 100%;
    }
    .mermaid svg {
      max-width: 100%;
      height: auto;
    }
    #error {
      display: none;
      color: #EF4444;
      font-size: 13px;
      background: rgba(239,68,68,0.1);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(239,68,68,0.3);
      white-space: pre-wrap;
      font-family: Menlo, monospace;
    }
    #placeholder {
      color: #6B7280;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="placeholder">Loading diagram…</div>
    <div id="error"></div>
    <div class="mermaid" id="diagram" style="display:none"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        background: '#0D0D0F',
        primaryColor: '#1C1C1E',
        primaryTextColor: '#E5E5E7',
        primaryBorderColor: '#3F3F46',
        lineColor: '#6B7280',
        secondaryColor: '#2C2C2E',
        tertiaryColor: '#111113',
        nodeBorder: '#3F3F46',
        clusterBkg: '#161618',
        titleColor: '#E5E5E7',
        edgeLabelBackground: '#1C1C1E',
        attributeBackgroundColorEven: '#1C1C1E',
        attributeBackgroundColorOdd: '#161618',
      },
      securityLevel: 'loose',
      fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif',
      fontSize: 13,
    });

    // Render diagram injected by Flutter via loadHtmlString
    async function renderDiagram(source) {
      const diagramEl = document.getElementById('diagram');
      const errorEl = document.getElementById('error');
      const placeholder = document.getElementById('placeholder');
      placeholder.style.display = 'none';
      try {
        const { svg } = await mermaid.render('mermaid-svg', source);
        diagramEl.innerHTML = svg;
        diagramEl.style.display = 'block';
        errorEl.style.display = 'none';
      } catch (e) {
        errorEl.textContent = 'Diagram error: ' + e.message;
        errorEl.style.display = 'block';
        diagramEl.style.display = 'none';
      }
    }

    // Called by Flutter after page loads via runJavaScript
    window.renderMermaid = renderDiagram;

    // Auto-render if DIAGRAM_SOURCE placeholder was replaced before serving
    const src = `{{DIAGRAM_SOURCE}}`;
    if (src && src !== '{{DIAGRAM_SOURCE}}') {
      mermaid.loaded = mermaid.loaded || Promise.resolve();
      mermaid.loaded.then(() => renderDiagram(src));
    } else {
      // Wait for Flutter to call window.renderMermaid(source)
      document.getElementById('placeholder').textContent = 'Awaiting diagram…';
    }
  </script>
</body>
</html>
